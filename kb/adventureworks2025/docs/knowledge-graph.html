 s.BusinessEntityID", "facts": "19,972 pairs"}, {"subject": "Person", "predicate": "has_phone_type", "object": "Phone Number Type", "cardinality": "M:N", "description": "Phone number types recorded for a person.", "join": "FROM Person__Person s JOIN Person__PersonPhone v1 ON v1.BusinessEntityID = s.BusinessEntityID JOIN Person__PhoneNumberType o ON v1.PhoneNumberTypeID = o.PhoneNumberTypeID", "facts": "19,972 pairs"}, {"subject": "Product", "predicate": "measured_by", "object": "Unit of Measure", "cardinality": "N:1", "description": "Unit associated with the product size.", "join": "FROM Production__Product s JOIN Production__UnitMeasure o ON s.SizeUnitMeasureCode = o.UnitMeasureCode", "facts": "176 pairs"}, {"subject": "Product", "predicate": "weighed_by", "object": "Unit of Measure", "cardinality": "N:1", "description": "Unit associated with product weight.", "join": "FROM Production__Product s JOIN Production__UnitMeasure o ON s.WeightUnitMeasureCode = o.UnitMeasureCode", "facts": "205 pairs"}, {"subject": "Shopping Cart Item", "predicate": "contains_product", "object": "Product", "cardinality": "N:1", "description": "Product and quantity in the cart item.", "join": "FROM Sales__ShoppingCartItem s JOIN Production__Product o ON s.ProductID = o.ProductID", "facts": "3 pairs"}, {"subject": "Business Entity", "predicate": "has_address", "object": "Address", "cardinality": "M:N", "description": "Business entities can have multiple addresses through the address-assignment table.", "join": "FROM Person__BusinessEntity s JOIN Person__BusinessEntityAddress v1 ON v1.BusinessEntityID = s.BusinessEntityID JOIN Person__Address o ON v1.AddressID = o.AddressID", "facts": "19,614 pairs"}, {"subject": "Address", "predicate": "has_address_type", "object": "Address Type", "cardinality": "M:N", "description": "Address type is assigned to a business entity's address association.", "join": "FROM Person__Address s JOIN Person__BusinessEntityAddress v1 ON v1.AddressID = s.AddressID JOIN Person__AddressType o ON v1.AddressTypeID = o.AddressTypeID", "facts": "19,614 pairs"}, {"subject": "Reseller Customer", "predicate": "has_contact", "object": "Store Contact", "cardinality": "N:1", "description": "The reseller customer record may identify the store contact through PersonID.", "join": "FROM (SELECT * FROM Sales__Customer WHERE StoreID IS NOT NULL) s JOIN (SELECT * FROM Person__Person WHERE PersonType = 'SC') o ON s.PersonID = o.BusinessEntityID WHERE s.StoreID IS NOT NULL", "facts": "635 pairs"}, {"subject": "Archived Inventory Transaction", "predicate": "for_sales_order", "object": "Sales Order", "cardinality": "N:1", "description": "Order behind an archived stock movement; TransactionType says which kind.", "join": "FROM Production__TransactionHistoryArchive s JOIN Sales__SalesOrderHeader o ON s.ReferenceOrderID = o.SalesOrderID WHERE s.TransactionType = 'S'", "facts": "46,742 pairs"}, {"subject": "Archived Inventory Transaction", "predicate": "for_purchase_order", "object": "Purchase Order", "cardinality": "N:1", "description": "Order behind an archived stock movement; TransactionType says which kind.", "join": "FROM Production__TransactionHistoryArchive s JOIN Purchasing__PurchaseOrderHeader o ON s.ReferenceOrderID = o.PurchaseOrderID WHERE s.TransactionType = 'P'", "facts": "922 pairs"}, {"subject": "Archived Inventory Transaction", "predicate": "for_work_order", "object": "Work Order", "cardinality": "1:1", "description": "Order behind an archived stock movement; TransactionType says which kind.", "join": "FROM Production__TransactionHistoryArchive s JOIN Production__WorkOrder o ON s.ReferenceOrderID = o.WorkOrderID WHERE s.TransactionType = 'W'", "facts": "41,589 pairs"}], "tables": ["HumanResources__Department", "HumanResources__Employee", "HumanResources__EmployeePayHistory", "HumanResources__JobCandidate", "HumanResources__Shift", "Person__Address", "Person__AddressType", "Person__BusinessEntity", "Person__ContactType", "Person__CountryRegion", "Person__EmailAddress", "Person__Person", "Person__PhoneNumberType", "Person__StateProvince", "Production__Culture", "Production__Document", "Production__Illustration", "Production__Location", "Production__Product", "Production__ProductCategory", "Production__ProductCostHistory", "Production__ProductDescription", "Production__ProductInventory", "Production__ProductListPriceHistory", "Production__ProductModel", "Production__ProductPhoto", "Production__ProductReview", "Production__ProductSubcategory", "Production__ScrapReason", "Production__TransactionHistory", "Production__TransactionHistoryArchive", "Production__UnitMeasure", "Production__WorkOrder", "Production__WorkOrderRouting", "Purchasing__PurchaseOrderDetail", "Purchasing__PurchaseOrderHeader", "Purchasing__ShipMethod", "Purchasing__Vendor", "Sales__CreditCard", "Sales__Currency", "Sales__CurrencyRate", "Sales__Customer", "Sales__SalesOrderDetail", "Sales__SalesOrderHeader", "Sales__SalesPerson", "Sales__SalesPersonQuotaHistory", "Sales__SalesReason", "Sales__SalesTaxRate", "Sales__SalesTerritory", "Sales__ShoppingCartItem", "Sales__SpecialOffer", "Sales__Store"]};
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = n => (typeof n === "number") ? n.toLocaleString() : "?";
const palette = ["#4e79a7", "#f28e2b", "#e15759", "#76b7b2", "#59a14f", "#edc948", "#b07aa1", "#ff9da7", "#9c755f", "#86bcb6"];
const domains = [...new Set(DATA.entities.map(e => e.domain))].sort();
const colorOf = d => palette[domains.indexOf(d) % palette.length];
const shapes = {core: "dot", event: "diamond", reference: "square", role: "triangle"};
const byName = Object.fromEntries(DATA.entities.map(e => [e.name, e]));
document.getElementById("summary").textContent =
  `${DATA.entities.length} entities, ${DATA.relations.length} relations, ${DATA.tables.length} tables (${DATA.dialect})`;
document.getElementById("legend").innerHTML =
  domains.map(d => `<span><i class="sw" style="background:${colorOf(d)}"></i>${esc(d)}</span>`).join("");
const nodes = new vis.DataSet(DATA.entities.map(e => ({
  id: "e:" + e.name, label: e.name, shape: shapes[e.kind] || "dot", color: colorOf(e.domain),
  size: 10 + Math.min(16, Math.log10((e.rows || 0) + 1) * 3), font: {size: 18}, title: e.description || e.name})));
const edges = new vis.DataSet(DATA.relations.map((r, i) => ({
  id: "r:" + i, from: "e:" + r.subject, to: "e:" + r.object, arrows: "to",
  label: r.predicate.replace(/_/g, " "), font: {size: 12, align: "middle"}, color: {color: "#9a9a9a"}})));
DATA.entities.forEach((e, i) => { if (e.is_a && byName[e.is_a]) edges.add({
  id: "i:" + i, from: "e:" + e.name, to: "e:" + e.is_a, arrows: "to", dashes: true, label: "is a",
  font: {size: 10}, color: {color: "#c4c4c4"}}); });
const net = new vis.Network(document.getElementById("net"), {nodes, edges}, {
  physics: {solver: "forceAtlas2Based", forceAtlas2Based: {gravitationalConstant: -80, springLength: 140},
            stabilization: {iterations: 400}},
  interaction: {hover: true, tooltipDelay: 200}, edges: {smooth: {type: "dynamic"}}});
net.once("stabilizationIterationsDone", () => net.setOptions({physics: false}));

function relLine(r) {
  const facts = r.facts ? `, ${esc(r.facts)} in data` : "";
  return `<li><a data-e="${esc(r.subject)}">${esc(r.subject)}</a> <b>${esc(r.predicate.replace(/_/g, " "))}</b> ` +
         `<a data-e="${esc(r.object)}">${esc(r.object)}</a> <span class="muted">(${esc(r.cardinality || "?")}${facts})</span>` +
         `<br><code>${esc(r.join)}</code></li>`;
}
function showEntity(name) {
  const e = byName[name]; if (!e) return;
  const rels = DATA.relations.filter(r => r.subject === name || r.object === name);
  const kids = DATA.entities.filter(x => x.is_a === name).map(x => `<a data-e="${esc(x.name)}">${esc(x.name)}</a>`);
  document.getElementById("details").innerHTML =
    `<h2>${esc(e.name)}</h2><div class="muted">${esc(e.kind)}${e.is_a ? " &middot; is a " + `<a data-e="${esc(e.is_a)}">${esc(e.is_a)}</a>` : ""}` +
    ` &middot; ${fmt(e.rows)} rows</div><p>${esc(e.description)}</p>` +
    (e.synonyms && e.synonyms.length ? `<div class="muted">Also called: ${esc(e.synonyms.join(", "))}</div>` : "") +
    `<p>Stored in <code>${esc(e.table)}${e.filter ? " WHERE " + esc(e.filter) : ""}</code>` +
    (e.key ? `<br>Key: <code>${esc(e.key)}</code>` : "") +
    (e.label && e.label.length ? `<br>Label: <code>${esc(e.label.join(", "))}</code>` : "") +
    (e.attributes && e.attributes.length ? `<br>Attributes: ${esc(e.attributes.join(", "))}` : "") + `</p>` +
    (kids.length ? `<div>Subtypes: ${kids.join(", ")}</div>` : "") +
    `<h2>Relations (${rels.length})</h2><ul>${rels.map(relLine).join("")}</ul>`;
}
function showRelation(r) {
  document.getElementById("details").innerHTML = `<h2>Relation</h2><ul>${relLine(r)}</ul><p>${esc(r.description)}</p>`;
}
document.getElementById("details").addEventListener("click", ev => {
  const n = ev.target.getAttribute && ev.target.getAttribute("data-e");
  if (n) { net.selectNodes(["e:" + n]); net.focus("e:" + n, {scale: 1.1, animation: true}); showEntity(n); }
});
net.on("click", p => {
  if (p.nodes.length && String(p.nodes[0]).startsWith("e:")) showEntity(String(p.nodes[0]).slice(2));
  else if (p.edges.length && String(p.edges[0]).startsWith("r:")) showRelation(DATA.relations[+String(p.edges[0]).slice(2)]);
});
document.getElementById("q").addEventListener("input", ev => {
  const q = ev.target.value.trim().toLowerCase(); if (!q) return;
  const e = DATA.entities.find(x => x.name.toLowerCase().includes(q)) ||
            DATA.entities.find(x => (x.synonyms || []).some(s => s.toLowerCase().includes(q))) ||
            DATA.entities.find(x => x.table.toLowerCase().includes(q));
  if (e) { net.selectNodes(["e:" + e.name]); net.focus("e:" + e.name, {scale: 1.1, animation: true}); showEntity(e.name); }
});
document.getElementById("tables").addEventListener("change", ev => {
  if (ev.target.checked) {
    nodes.add(DATA.tables.map(t => ({id: "t:" + t, label: t, shape: "box", color: "#eeeeee", font: {size: 11}})));
    edges.add(DATA.entities.map((e, i) => ({id: "s:" + i, from: "e:" + e.name, to: "t:" + e.table, dashes: [2, 4],
                                            color: {color: "#d0d0d0"}, arrows: ""})));
    net.setOptions({physics: true}); net.once("stabilizationIterationsDone", () => net.setOptions({physics: false}));
  } else {
    nodes.remove(nodes.getIds().filter(id => String(id).startsWith("t:")));
    edges.remove(edges.getIds().filter(id => String(id).startsWith("s:")));
  }
});
</script>
</body>
